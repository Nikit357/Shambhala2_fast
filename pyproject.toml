[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shambhala-containerized"
version = "0.1.0"
description = "Pure-Python + Octave implementation of the Shambhala2 gene expression harmonization algorithm"
authors = [{ name = "Daniil Nikitin", email = "danya.nikitin.orel@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23,<2.0",
    "scikit-learn>=1.3",
    "boto3>=1.26",
    "qnorm>=0.4.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shambhala*"]

[tool.pytest.ini_options]
timeout = 3600
timeout_method = "signal"
markers = [
    "timeout: abort test after N seconds (requires pytest-timeout)",
    "slow: timing tests — included by default; exclude with -m 'not slow'",
]
